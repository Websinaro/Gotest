name: Generate Go Modules

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  go-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Go project
        id: detect
        run: |
          if find . -name "*.go" -not -path "./.git/*" | grep -q .; then
            echo "go_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.detect.outputs.go_project == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Create go.mod if missing
        if: steps.detect.outputs.go_project == 'true'
        run: |
          if [ ! -f go.mod ]; then
            go mod init webalert
          fi

      - name: Generate go.sum and clean dependencies
        if: steps.detect.outputs.go_project == 'true'
        run: |
          go mod tidy

      - name: Verify dependencies
        if: steps.detect.outputs.go_project == 'true'
        run: |
          go mod verify

      - name: Test Go project
        if: steps.detect.outputs.go_project == 'true'
        run: |
          go test ./...

      - name: Commit generated module files
        if: steps.detect.outputs.go_project == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum

          if git diff --cached --quiet; then
            echo "No changes to go.mod or go.sum."
          else
            git commit -m "chore: update Go module files"
            git push
          fi
