name: Generate Go Module Files

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-go-mod:
    name: Generate go.mod and go.sum
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # 3. Check that Go source exists
      - name: Check Go project
        run: |
          if ! find . -name "*.go" -not -path "./.git/*" | grep -q .; then
            echo "No Go source files found."
            exit 1
          fi

      # 4. Remove existing module files
      - name: Remove existing Go module files
        run: |
          rm -f go.mod
          rm -f go.sum

      # 5. Create fresh go.mod
      - name: Initialize Go module
        run: |
          go mod init kabackend

      # 6. Automatically discover dependencies
      #    and generate go.sum
      - name: Generate go.mod and go.sum
        run: |
          go mod tidy

      # 7. Display generated files
      - name: Show generated module files
        run: |
          echo "===================="
          echo "go.mod"
          echo "===================="
          cat go.mod

          echo ""
          echo "===================="
          echo "go.sum"
          echo "===================="
          cat go.sum

      # 8. Verify dependency checksums
      - name: Verify dependencies
        run: |
          go mod verify

      # 9. Download dependencies
      - name: Download dependencies
        run: |
          go mod download

      # 10. Test the entire Go project
      - name: Run Go tests
        run: |
          go test ./...

      # 11. Check formatting
      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      # 12. Commit generated files
      - name: Commit go.mod and go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate Go module files"
            git push
          fi
