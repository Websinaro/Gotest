name: Go CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Format Go code
        run: gofmt -w .

      - name: Update dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum '*.go' '**/*.go' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update Go dependencies and format code"
            git push
          fi
