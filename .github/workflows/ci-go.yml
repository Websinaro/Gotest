name: Go CI

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  go:
    name: Build and Verify Go Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Format Go code
        run: |
          gofmt -w .

      - name: Regenerate go.sum
        run: |
          rm -f go.sum
          go mod tidy

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Run tests
        run: |
          go test ./...

      - name: Build
        run: |
          go build ./...

      - name: Check formatting
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum '*.go' '**/*.go' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Go dependencies and formatting"
            git push
          fi
